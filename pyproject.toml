[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hds-fog-scheduler"
version = "0.7.0"
description = "Paper-aligned HDS and baseline scheduling experiments for workflow-derived SFCs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.scripts]
hds-sim = "hds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
